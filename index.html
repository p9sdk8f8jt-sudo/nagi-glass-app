<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="凪CORE">
  <link rel="manifest" href="/manifest.json">
  <title>凪CORE</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#071014; color:#eef7f7; display:grid; place-items:center; overflow:hidden; }
    .glass { width:min(92vw,760px); padding:28px; border:1px solid rgba(255,255,255,.16); border-radius:28px; background:rgba(255,255,255,.07); backdrop-filter:blur(22px); box-shadow:0 24px 80px rgba(0,0,0,.45); }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { font-size:28px; font-weight:700; letter-spacing:.08em; }
    .status { font-size:13px; opacity:.72; }
    .orb { width:130px; height:130px; margin:48px auto 28px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#b9ffff 16%,#5dd8d8 42%,#173f46 72%,transparent 73%); filter:drop-shadow(0 0 32px rgba(100,240,240,.45)); animation:breathe 3s ease-in-out infinite; }
    @keyframes breathe { 50% { transform:scale(1.08); filter:drop-shadow(0 0 50px rgba(100,240,240,.65)); } }
    .message { text-align:center; font-size:18px; margin-bottom:24px; }
    .bar { display:flex; gap:10px; }
    input { flex:1; min-width:0; padding:15px 16px; border-radius:16px; border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.2); color:inherit; outline:none; }
    button { padding:0 20px; border:0; border-radius:16px; background:#dff; color:#123; font-weight:700; }
    button:disabled { opacity:.55; }
    #reply { margin-top:16px; min-height:24px; opacity:.82; text-align:center; white-space:pre-wrap; }
    #history { margin-top:20px; max-height:42vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
    .entry { padding:12px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.5; }
    .entry.user { align-self:flex-end; max-width:88%; background:rgba(25,60,57,.8); }
    .entry.assistant { align-self:flex-start; max-width:88%; background:rgba(18,33,39,.9); }
    .entry small { display:block; opacity:.55; margin-bottom:4px; font-size:11px; }
    .actions { display:flex; justify-content:flex-end; margin-top:10px; }
    .clear { padding:8px 12px; font-size:12px; background:transparent; color:#aac; border:1px solid rgba(255,255,255,.12); }
  </style>
</head>
<body>
  <main class="glass">
    <div class="top"><div class="brand">凪CORE</div><div class="status">● ONLINE / AI READY</div></div>
    <div class="orb" aria-label="凪CORE"></div>
    <div class="message">凪CORE 起動しました。</div>
    <div class="bar"><input id="input" placeholder="凪に話しかける…" autocomplete="off"><button id="send">送る</button></div>
    <div id="reply"></div>
    <div id="history" aria-live="polite"></div>
    <div class="actions"><button class="clear" id="clear">履歴を消去</button></div>
  </main>
  <script>
    const input=document.getElementById("input"),reply=document.getElementById("reply"),send=document.getElementById("send"),history=document.getElementById("history"),clear=document.getElementById("clear");
    const STORAGE_KEY="nagi-core-chat-history-v1";
    function loadHistory(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(saved)?saved:[]}catch{return[]}}
    function saveHistory(items){localStorage.setItem(STORAGE_KEY,JSON.stringify(items.slice(-100)))}
    function renderHistory(){history.innerHTML="";for(const item of loadHistory()){const entry=document.createElement("div");entry.className="entry "+item.role;const label=document.createElement("small");label.textContent=item.role==="user"?"あなた":"凪";const text=document.createElement("div");text.textContent=item.text;entry.append(label,text);history.appendChild(entry)}history.scrollTop=history.scrollHeight}
    function addHistory(role,text){const items=loadHistory();items.push({role,text,time:Date.now()});saveHistory(items);renderHistory()}
    async function sendMessage(){
      const text=input.value.trim();
      if(!text||send.disabled)return;
      const previousHistory=loadHistory().filter(item=>(item?.role==="user"||item?.role==="assistant")&&typeof item?.text==="string"&&item.text.trim()).slice(-20);
      send.disabled=true;
      input.value="";
      reply.textContent="凪、考え中…";
      addHistory("user",text);
      try{
        const response=await fetch("/api/chat",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({message:text,history:previousHistory})
        });
        const data=await response.json();
        if(!response.ok)throw new Error(data.error||"AI接続に失敗したよ。");
        reply.textContent=data.reply;
        addHistory("assistant",data.reply);
      }catch(error){
        const errorText="AI接続エラー："+error.message;
        reply.textContent=errorText;
        addHistory("assistant",errorText);
      }finally{
        send.disabled=false;
        input.focus();
      }
    }
    clear.onclick=()=>{if(confirm("この端末に保存された会話履歴を消去する？")){localStorage.removeItem(STORAGE_KEY);renderHistory();reply.textContent="履歴を消去したよ。"}};
    send.onclick=sendMessage;
    input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.isComposing)sendMessage()});
    if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
    renderHistory();
  </script>
</body>
</html>
