<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.json"><title>Sike.</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f5f7f8;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100svh;display:flex;flex-direction:column}header{height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #20242a;position:sticky;top:0;background:#0b0d10}.logo{font-weight:700;letter-spacing:.08em}.status{position:absolute;right:12px;font-size:10px;color:#75d9d1}main{width:100%;max-width:950px;margin:auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.panel{border:1px solid #252b34;border-radius:15px;background:#101419;padding:12px;min-width:0}.thread{height:48svh;min-height:250px;overflow:auto;display:flex;flex-direction:column;gap:10px}.row{display:flex}.row.user{justify-content:flex-end}.bubble{max-width:88%;padding:10px 12px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;background:#191e24}.user .bubble{background:#17504b}.name{font-size:10px;opacity:.5;margin-bottom:3px}.sources a{display:block;color:#9fe6e1;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.welcome{text-align:center;margin:auto;opacity:.7}.orb{width:48px;height:48px;margin:0 auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b8ffff 18%,#51cbc8 46%,#18373c 73%)}form{display:flex;gap:7px;margin-top:10px}input,textarea{min-width:0;flex:1;background:#171b20;color:#fff;border:1px solid #303741;border-radius:12px;padding:11px;font:inherit}button{background:#dff;color:#12201f;border:0;border-radius:12px;padding:9px 12px;font-weight:700}button.secondary{background:#202832;color:#e8f0f8;border:1px solid #343d49;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.section-title{font-size:13px;margin:0 0 8px}.hint{font-size:11px;color:#929eac}.entry{padding:8px 0;border-top:1px solid #252b34;font-size:12px;overflow-wrap:anywhere}.entry small{display:block;color:#8e9aa8;font-size:10px}.journal{max-height:250px;overflow:auto}.tools{display:flex;gap:7px;flex-wrap:wrap}.proposal{margin-top:12px}@media(min-width:760px){main{grid-template-columns:minmax(0,1.4fr) minmax(260px,.8fr)}.thread{height:60svh}}
</style></head><body><div class="app"><header><div class="logo">Sike.</div><div class="status">VESSEL · GROWTH CORE</div></header>
<main><section class="panel"><div id="thread" class="thread"><div class="welcome"><div class="orb"></div><b>Sike.</b><div class="hint">自立型AIへの土台づくり、ここから。</div></div></div><form id="form"><input id="input" maxlength="12000" placeholder="Sike.に話しかける…" autocomplete="off" required><button id="send">↑</button></form><div class="actions"><button class="secondary" id="clear" type="button">会話を消去</button><button class="secondary" id="reflect" type="button">直前の回答を振り返る</button></div></section>
<aside class="panel"><h2 class="section-title">成長ジャーナル</h2><div class="hint" id="identity"></div><div class="hint">記録はこの端末のブラウザ内に保存。モデル自体の学習とは別の仕組みだよ。</div><h2 class="section-title" style="margin-top:14px">成長目標</h2><div id="goals" class="journal"></div><div class="actions"><button class="secondary" id="addGoal" type="button">目標を追加</button><button class="secondary" id="updateGoal" type="button">目標の状態を更新</button></div><h2 class="section-title" style="margin-top:14px">変更審査キュー</h2><div class="hint">変更案は記録・審査まで。コードへの自動適用はしない。</div><div id="changes" class="journal"></div><div class="actions"><button class="secondary" id="addChange" type="button">変更案を記録</button></div><div class="actions"><button class="secondary" id="observe" type="button">記録を観察して改善案を作る</button><button class="secondary" id="proposal" type="button">改善案を手動記録</button><button class="secondary" id="experiment" type="button">実験結果を記録</button></div><div class="actions"><button class="secondary" id="export" type="button">バックアップを書き出す</button><button class="secondary" id="import" type="button">バックアップを復元</button><input id="file" type="file" accept="application/json" hidden></div><div class="proposal"><h2 class="section-title">最近の記録</h2><div id="journal" class="journal"></div></div></aside></main></div>
<script type="module">
import {appendJournal,readJournal,exportJournal,importJournal} from "./core/memory.js";
import {createReflection,createImprovementProposal,recordExperiment} from "./core/reflection.js";
import {observeForLearning} from "./core/learning.js";
import {describeIdentity} from "./core/identity.js";
import {createGoal,listGoals,updateGoal} from "./core/goals.js";
import {createChangeRequest,listChangeRequests} from "./core/change-manager.js";
const $=id=>document.getElementById(id),thread=$("thread"),input=$("input"),send=$("send"),HKEY="sike-chat-history-v3";let lastReply="",lastPrompt="";
function load(){try{const x=JSON.parse(localStorage.getItem(HKEY)||"[]");return Array.isArray(x)?x:[]}catch{return[]}}
function save(x){localStorage.setItem(HKEY,JSON.stringify(x.slice(-100)))}
function bubble(role,text,sources=[]){const row=document.createElement("div");row.className="row "+role;const b=document.createElement("div");b.className="bubble";const n=document.createElement("div");n.className="name";n.textContent=role==="user"?"あなた":"Sike.";const t=document.createElement("div");t.textContent=text;b.append(n,t);if(sources.length){const box=document.createElement("div");box.className="sources";for(const s of sources.slice(0,5)){const a=document.createElement("a");a.href=s.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=s.title||s.url;box.append(a)}b.append(box)}row.append(b);thread.append(row);thread.scrollTop=thread.scrollHeight}
function renderChat(){thread.replaceChildren();const rows=load();if(!rows.length){const w=document.createElement("div");w.className="welcome";w.textContent="Sike. — 自立型AIへの土台づくり、ここから。";thread.append(w);return}for(const x of rows)bubble(x.role==="user"?"user":"assistant",x.text||"",x.sources||[]);thread.scrollTop=thread.scrollHeight}
function add(role,text,sources=[]){const x=load();x.push({role,text,sources,time:Date.now()});save(x);bubble(role,text,sources)}
function renderJournal(){const root=$("journal");root.replaceChildren();const rows=readJournal().slice().reverse().slice(0,25);if(!rows.length){root.textContent="まだ記録はありません。";return}for(const x of rows){const d=document.createElement("div");d.className="entry";const label=document.createElement("div");label.textContent=({reflection:"振り返り", "improvement-proposal":"改善案",experiment:"実験", "self-observation":"自己観察","conversation-prompt":"会話記録","conversation-result":"応答記録",error:"エラー"}[x.kind]||x.kind)+" — "+(x.title||x.content||x.prompt||x.method||x.message||"");const sm=document.createElement("small");sm.textContent=new Date(x.at).toLocaleString()+" · "+x.kind;d.append(label,sm);root.append(d)}}
function renderGoals(){const root=$("goals");root.replaceChildren();const rows=listGoals();if(!rows.length){root.textContent="まだ目標はありません。";return}for(const x of rows){const d=document.createElement("div");d.className="entry";const label=document.createElement("div");label.textContent=(x.priority==="high"?"[高] ":"")+x.title;const sm=document.createElement("small");sm.textContent=(x.status||"active")+" · "+(x.successCriteria||x.reason||"成功基準未設定");d.append(label,sm);root.append(d)}}
function renderChanges(){const root=$("changes");root.replaceChildren();const rows=listChangeRequests().slice(0,8);if(!rows.length){root.textContent="審査待ちの変更案はありません。";return}for(const x of rows){const d=document.createElement("div");d.className="entry";const label=document.createElement("div");label.textContent=x.title;const sm=document.createElement("small");sm.textContent=(x.status||"needs-review")+" · "+(x.assessment?.safeToStage?"通常審査":"明示的な確認が必要");d.append(label,sm);root.append(d)}}
$("identity").textContent=describeIdentity().purpose+" · "+describeIdentity().stage;
$("addGoal").onclick=()=>{const title=prompt("達成したい目標は？");if(!title)return;createGoal({title,reason:prompt("なぜ必要？")||"",successCriteria:prompt("何をもって達成とする？")||"",priority:prompt("優先度：low / normal / high","normal")||"normal"});renderGoals();renderJournal()};
$("updateGoal").onclick=()=>{const goals=listGoals().filter(x=>x.status==="active"||x.status==="paused");if(!goals.length)return alert("更新できる目標がありません");const pick=prompt("更新する目標の番号を入力：\\n"+goals.map((g,i)=>(i+1)+". "+g.title+" ["+g.status+"]").join("\\n"));const goal=goals[Number(pick)-1];if(!goal)return;const status=prompt("状態：active / paused / completed / cancelled",goal.status);if(!status)return;try{updateGoal(goal.id,{status,progressNote:prompt("進捗メモ（任意）")||""});renderGoals();renderJournal()}catch(e){alert(e.message)}};
$("addChange").onclick=()=>{const title=prompt("変更したい内容は？");if(!title)return;const files=(prompt("対象ファイル（カンマ区切り、未定なら空欄）")||"").split(",").map(x=>x.trim()).filter(Boolean);createChangeRequest({title,rationale:prompt("変更する理由は？")||"",files,tests:prompt("必要なテストは？")||"",rollbackPlan:prompt("復旧方法は？")||""});renderChanges();renderJournal()};

$("form").addEventListener("submit",async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;lastPrompt=text;const hist=load().filter(x=>["user","assistant"].includes(x.role)&&x.text).slice(-30).map(x=>({role:x.role,content:x.text}));input.value="";if(!load().length)thread.replaceChildren();add("user",text);appendJournal({kind:"conversation-prompt",content:text});send.disabled=true;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history:hist})});const d=await r.json();if(!r.ok)throw Error(d.error||"AI接続に失敗したよ");lastReply=d.reply||"";add("assistant",lastReply,d.sources||[]);appendJournal({kind:"conversation-result",prompt:text,reply:lastReply,core:d.core||"unknown"})}catch(e){add("assistant","AI接続エラー："+e.message);appendJournal({kind:"error",message:e.message})}finally{send.disabled=false;input.focus();renderJournal()}});
$("clear").onclick=()=>{if(confirm("会話履歴を消去する？")){localStorage.removeItem(HKEY);renderChat()}};
$("reflect").onclick=()=>{if(!lastReply)return alert("まず会話してね");const rating=prompt("直前の回答を1〜5で評価");if(rating===null)return;createReflection({prompt:lastPrompt,reply:lastReply,rating,note:prompt("理由・気づき（任意）")||""});renderJournal()};
$("proposal").onclick=()=>{const title=prompt("改善したい点は？");if(!title)return;createImprovementProposal({title,hypothesis:prompt("原因の仮説は？")||"",experiment:prompt("どう試す？")||"",successCriteria:prompt("成功の判定基準は？")||""});renderJournal()};
$("experiment").onclick=()=>{const method=prompt("試した方法は？");if(!method)return;recordExperiment({method,result:prompt("結果は？")||"",passed:confirm("成功した？ OK=成功 / キャンセル=未成功")});renderJournal()};
$("observe").onclick=()=>{const r=observeForLearning();alert("観察した記録："+r.summary.inspected+"件\n改善案："+(r.proposal?.title||"まだ作成できません")+"\nコード変更や自動適用は行っていません。");renderJournal()};
$("export").onclick=()=>{const blob=new Blob([exportJournal()],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="sike-growth-journal.json";a.click();URL.revokeObjectURL(url)};
$("import").onclick=()=>$("file").click();$("file").onchange=async()=>{const f=$("file").files[0];if(!f)return;try{alert(importJournal(await f.text())+"件の記録を復元しました");renderJournal()}catch(e){alert("復元できません："+e.message)}$("file").value=""};
renderChat();renderJournal();renderGoals();renderChanges();if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script></body></html>
