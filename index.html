<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sike.">
<link rel="manifest" href="/manifest.json">
<title>Sike.</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0b0d10;color:#f5f7f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}
.app{height:100svh;display:flex;flex-direction:column;background:#0b0d10}
header{height:60px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #20242a;position:relative}
.logo{font-weight:700;letter-spacing:.08em}.status{position:absolute;right:15px;font-size:10px;color:#75d9d1}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#75d9d1;margin-right:5px}
main{flex:1;min-height:0;overflow-y:auto;padding:18px 14px 24px}
.thread{max-width:820px;margin:auto;min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.welcome{margin:auto;text-align:center;opacity:.75}.orb{width:64px;height:64px;margin:0 auto 15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b8ffff 18%,#51cbc8 46%,#18373c 73%);box-shadow:0 0 42px #4ed9d044}.welcome b{display:block;font-size:17px}.welcome span{display:block;margin-top:7px;font-size:12px;opacity:.5}
.row{display:flex;margin:0 0 12px}.row.user{justify-content:flex-end}.bubble{max-width:min(78%,620px);padding:10px 13px;border-radius:18px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word}.user .bubble{background:#17504b;border-bottom-right-radius:5px}.assistant .bubble{background:#191e24;border-bottom-left-radius:5px}.name{font-size:9px;opacity:.42;margin-bottom:3px}.user .name{text-align:right}
.composer{flex:none;border-top:1px solid #20242a;background:#0d1014;padding:8px 12px max(10px,env(safe-area-inset-bottom))}
.form{max-width:820px;margin:auto;display:flex;gap:8px;align-items:center}.input{flex:1;min-width:0;height:44px;border:1px solid #292e35;background:#171b20;color:#fff;border-radius:22px;padding:0 16px;font-size:16px;outline:none}.input:focus{border-color:#62bdb7}.send{width:44px;height:44px;border:0;border-radius:50%;background:#dff;color:#12201f;font-size:18px;font-weight:800}.send:disabled{opacity:.4}.clear{display:block;margin:4px auto 0;border:0;background:transparent;color:#626a73;font-size:10px;padding:3px}
@media(min-width:800px){.app{max-width:920px;margin:auto;border-left:1px solid #181c21;border-right:1px solid #181c21}}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Sike.</div><div class="status"><i></i>ONLINE</div></header>
<main id="scroll"><div id="thread" class="thread"></div></main>
<div class="composer">
<form id="form" class="form"><input id="input" class="input" placeholder="凪に話しかける…" autocomplete="off" enterkeyhint="send"><button id="send" class="send" type="submit">↑</button></form>
<button id="clear" class="clear" type="button">会話を消去</button>
</div>
</div>
<script>
const KEY="sike-chat-history-v1";
const thread=document.getElementById("thread"),scroll=document.getElementById("scroll"),input=document.getElementById("input"),send=document.getElementById("send");
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch{return[]}}
function save(x){localStorage.setItem(KEY,JSON.stringify(x.slice(-100)))}
function render(){const items=load();thread.innerHTML="";if(!items.length){thread.innerHTML='<div class="welcome"><div class="orb"></div><b>Sike.</b><span>ここから凪との会話がはじまる</span></div>';return}for(const x of items){if(!x?.text)continue;const row=document.createElement("div");row.className="row "+(x.role==="user"?"user":"assistant");const b=document.createElement("div");b.className="bubble";const n=document.createElement("div");n.className="name";n.textContent=x.role==="user"?"あなた":"凪";const t=document.createElement("div");t.textContent=x.text;b.append(n,t);row.append(b);thread.append(row)}scrollTop()}
function scrollTop(){requestAnimationFrame(()=>scroll.scrollTop=scroll.scrollHeight)}
function add(role,text){const x=load();x.push({role,text,time:Date.now()});save(x);render()}
async function chat(){const text=input.value.trim();if(!text||send.disabled)return;const history=load().filter(x=>(x.role==="user"||x.role==="assistant")&&x.text).slice(-20);send.disabled=true;input.value="";add("user",text);const wait=document.createElement("div");wait.className="row assistant";wait.innerHTML='<div class="bubble"><div class="name">凪</div><div>考え中…</div></div>';thread.append(wait);scrollTop();try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history})});const d=await r.json();if(!r.ok)throw Error(d.error||"AI接続に失敗したよ。");wait.remove();add("assistant",d.reply)}catch(e){wait.remove();add("assistant","AI接続エラー："+e.message)}finally{send.disabled=false;input.focus()}}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();chat()});
document.getElementById("clear").onclick=()=>{if(confirm("この端末の会話履歴を消去する？")){localStorage.removeItem(KEY);render()}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});
render();
</script>
</body>
</html>
