<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="凪CORE">
  <link rel="manifest" href="/manifest.json">
  <title>凪CORE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #071014; color: #eef7f7; display: grid; place-items: center; overflow: hidden;
    }
    .glass {
      width: min(92vw, 760px); padding: 28px; border: 1px solid rgba(255,255,255,.16);
      border-radius: 28px; background: rgba(255,255,255,.07); backdrop-filter: blur(22px);
      box-shadow: 0 24px 80px rgba(0,0,0,.45);
    }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { font-size: 28px; font-weight: 700; letter-spacing: .08em; }
    .status { font-size: 13px; opacity: .72; }
    .orb { width: 130px; height:130px; margin: 48px auto 28px; border-radius:50%;
      background: radial-gradient(circle at 35% 30%, #fff, #b9ffff 16%, #5dd8d8 42%, #173f46 72%, transparent 73%);
      filter: drop-shadow(0 0 32px rgba(100,240,240,.45)); animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe { 50% { transform:scale(1.08); filter:drop-shadow(0 0 50px rgba(100,240,240,.65)); } }
    .message { text-align:center; font-size:18px; margin-bottom:24px; }
    .bar { display:flex; gap:10px; }
    input { flex:1; min-width:0; padding:15px 16px; border-radius:16px; border:1px solid rgba(255,255,255,.14);
      background:rgba(0,0,0,.2); color:inherit; outline:none; }
    button { padding:0 20px; border:0; border-radius:16px; background:#dff; color:#123; font-weight:700; }
    button:disabled { opacity:.55; }
    #reply { margin-top:16px; min-height:24px; opacity:.82; text-align:center; white-space:pre-wrap; }
  </style>
</head>
<body>
  <main class="glass">
    <div class="top"><div class="brand">凪CORE</div><div class="status">● ONLINE / AI READY</div></div>
    <div class="orb" aria-label="凪CORE"></div>
    <div class="message">凪CORE 起動しました。</div>
    <div class="bar">
      <input id="input" placeholder="凪に話しかける…" autocomplete="off">
      <button id="send">送る</button>
    </div>
    <div id="reply"></div>
  </main>
  <script>
    const input = document.getElementById("input");
    const reply = document.getElementById("reply");
    const send = document.getElementById("send");

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      send.disabled = true;
      reply.textContent = "凪、考え中…";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "AI接続に失敗したよ。");

        reply.textContent = data.reply;
        input.value = "";
      } catch (error) {
        reply.textContent = "AI接続エラー：" + error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    send.onclick = sendMessage;
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
